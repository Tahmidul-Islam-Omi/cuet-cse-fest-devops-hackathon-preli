services:
  mongo:
    image: mongo:7.0
    container_name: prod-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data-prod:/data/db
    env_file:
      - ../.env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: prod-backend
    restart: always
    env_file:
      - ../.env
    networks:
      - app-network
    depends_on:
      mongo:
        condition: service_healthy

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: prod-gateway
    restart: always
    env_file:
      - ../.env
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "${GATEWAY_PORT}:8080"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data-prod:
    driver: local

networks:
  app-network:
    driver: bridge
