services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0-jammy
    container_name: ecommerce-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      # Named volume for data persistence
      - mongodb_data_dev:/data/db
      # MongoDB config persistence
      - mongodb_config_dev:/data/configdb
    networks:
      - ecommerce-network
    # Internal port only - not exposed to host
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Backend Service
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: ecommerce-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      BACKEND_PORT: ${BACKEND_PORT}
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${MONGO_DATABASE}
    volumes:
      # Mount source code for hot-reload
      - ../backend/src:/app/src:ro
      # Mount package.json for dependency changes
      - ../backend/package.json:/app/package.json:ro
      # Prevent node_modules from being overwritten
      - /app/node_modules
    networks:
      - ecommerce-network
    # Internal port only - not exposed to host
    expose:
      - "3847"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3847/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Gateway Service (API Gateway)
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile.dev
    container_name: ecommerce-gateway-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      GATEWAY_PORT: ${GATEWAY_PORT}
      BACKEND_URL: http://backend:${BACKEND_PORT}
    ports:
      # Only gateway is exposed to host
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    volumes:
      # Mount source code for hot-reload
      - ../gateway/src:/app/src:ro
      # Mount package.json for dependency changes
      - ../gateway/package.json:/app/package.json:ro
      # Prevent node_modules from being overwritten
      - /app/node_modules
    networks:
      - ecommerce-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5921/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

# Named volumes for data persistence
volumes:
  mongodb_data_dev:
    driver: local
  mongodb_config_dev:
    driver: local

# Custom bridge network for service communication
networks:
  ecommerce-network:
    driver: bridge
    name: ecommerce-dev-network
