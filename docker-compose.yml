# Default docker-compose file (development mode)
# For production, use: docker-compose -f docker/compose.production.yaml up

services:
  mongo:
    image: mongo:7.0
    container_name: dev-mongo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data-dev:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: dev-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${MONGO_DATABASE}
      BACKEND_PORT: ${BACKEND_PORT}
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - backend-node-modules:/app/node_modules
    networks:
      - app-network
    depends_on:
      mongo:
        condition: service_healthy
    command: npm run dev

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile.dev
    container_name: dev-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      GATEWAY_PORT: ${GATEWAY_PORT}
      BACKEND_URL: http://backend:${BACKEND_PORT}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    volumes:
      - ./gateway/src:/app/src
      - ./gateway/package.json:/app/package.json
      - gateway-node-modules:/app/node_modules
    networks:
      - app-network
    depends_on:
      - backend
    command: npm run dev

volumes:
  mongo-data-dev:
    driver: local
  backend-node-modules:
  gateway-node-modules:

networks:
  app-network:
    driver: bridge
